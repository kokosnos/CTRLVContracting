<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTRLV Contract Market</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            margin: 0;
        }

        /* Header */
        .header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: start;
            margin-bottom: 20px;
        }
        .header-logo {
            display: flex;
            align-items: center;
        }
        .main-logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            display: block;
        }
        .header-center {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 4px;
        }
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            min-width: 220px;
        }
        .stats-box {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px 18px;
            display: inline-block;
        }
        .stats-box .stat-row {
            font-size: 1rem;
            margin: 3px 0;
        }
        .stats-box .stat-label {
            color: #aaa;
            font-size: 0.8rem;
        }
        .stats-box .stat-value {
            color: #fff;
            font-weight: bold;
        }
        .last-updated {
            color: #888;
            font-size: 0.75rem;
        }

        /* Auth */
        #auth-section {
            line-height: 1;
        }
        .sso-button-img {
            display: inline-block;
            vertical-align: middle;
            border-radius: 4px;
            transition: transform 0.1s ease, filter 0.2s ease;
            cursor: pointer;
        }
        .sso-button-img:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }

        /* Search */
        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 8px 12px;
            font-size: 0.95rem;
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            outline: none;
        }
        .search-bar input::placeholder { color: #777; }
        .search-bar input:focus { border-color: #007bff; }

        /* Filter chips */
        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chip {
            padding: 5px 12px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-radius: 16px;
            color: #ccc;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
            user-select: none;
        }
        .chip:hover {
            background-color: #333;
            border-color: #777;
        }
        .chip.active {
            background-color: #007bff;
            border-color: #007bff;
            color: #fff;
        }

        /* Sort controls */
        .sort-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .sort-btn {
            padding: 8px 14px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background-color 0.15s;
        }
        .sort-btn:hover { background-color: #444; }
        .sort-btn.active {
            background-color: #007bff;
            border-color: #007bff;
        }
        .sort-indicator {
            margin-left: 6px;
            font-size: 0.75rem;
        }

        /* Card grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            transition: border-color 0.2s, transform 0.15s;
        }
        .card:hover {
            border-color: #007bff;
            transform: translateY(-2px);
        }
        .card-image {
            width: 128px;
            height: 128px;
            object-fit: contain;
            border-radius: 6px;
            background-color: #1a1a1a;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            display: block;
            margin: 0 auto 12px auto;
        }
        .card-image:hover {
            transform: scale(1.03);
            filter: brightness(1.15);
        }
.card-image-wrapper {
    position: relative;
    display: inline-block;
    overflow: hidden;        /* lets the corner triangle follow the image's rounded corner */
    border-radius: 6px;
}
/* All tech badges: a right triangle filling the top-left corner, like in-game */
:root {
    --t2: #c4600c;
    --t3: #d9480f;       /* placeholder: replace with the sampled hex */
    --faction: #0b6b22;
    --pirate: #a01212;
}

/* Right triangle filling the top-left corner. The content box is the
   inner 2/3 of the badge, so centering in it puts the icon at the
   triangle's visual center (1/3 of the way in from each edge). */
.tech-badge {
    position: absolute;
    top: 0;
    left: 0;
    width: 40px;
    height: 40px;
    z-index: 2;
    pointer-events: none;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    box-sizing: border-box;
    padding: 0 33.333% 33.333% 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 900;
    font-size: 0.8rem;
    line-height: 1;
}
.tech-badge svg {
    width: 16px;
    height: 16px;
    display: block;
}
.badge-t2      { background: var(--t2); }
.badge-t3      { background: var(--t3); }
.badge-faction { background: var(--faction); }
.badge-pirate  { background: var(--pirate); }
        .card-name {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .card-ship {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 2px;
            line-height: 1.3;
        }
        .card-name.card-subtitle {
            font-weight: normal;
            font-size: 0.9rem;
            color: #aaa;
        }
        .card-details {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }
        .card-price {
            color: #ffd700;
            font-weight: bold;
        }
        .card-count {
            background-color: #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        /* Error / loading */
        .status-message {
            text-align: center;
            color: #ff4444;
            padding: 40px;
            font-size: 1.1rem;
        }


    </style>
</head>
<body>

    <div class="header">
        <div class="header-logo">
            <img src="img/logo.png" class="main-logo" alt="Alliance Logo">
        </div>
        <div class="header-center">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search fits..." oninput="handleSearch(this.value)">
            </div>
            <div class="filter-chips" id="filter-chips"></div>
            <div class="sort-bar">
                <button class="sort-btn" id="sort-title" onclick="sortBy('title')">
                    Name<span class="sort-indicator" id="ind-title"></span>
                </button>
                <button class="sort-btn" id="sort-min_price" onclick="sortBy('min_price')">
                    Price<span class="sort-indicator" id="ind-min_price"></span>
                </button>
            </div>
        </div>
        <div class="header-right">
            <div id="auth-section">
                <img src="https://web.ccpgamescdn.com/eveonlineassets/developers/eve-sso-login-black-small.png"
                     class="sso-button-img"
                     alt="Log in with EVE Online"
                     onclick="startPkceLogin()">
            </div>
            <div class="stats-box">
                <div class="stat-row">
                    <span class="stat-label">Total ISK on Market</span><br>
                    <span class="stat-value" id="total-isk">0 ISK</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Total Ships</span><br>
                    <span class="stat-value" id="total-ships">0</span>
                </div>
            </div>
            <div class="last-updated" id="last-updated"></div>
        </div>
    </div>



    <div class="card-grid" id="contract-grid">
        <!-- Cards injected here -->
    </div>

    <script>
        // --- CONFIGURATION ---
        const clientId = 'cfa2156da20a418dad346c0f991f3183';
        const redirectUri = 'https://kokosnos.github.io/CTRLVContracting/';
        const scope = 'esi-ui.open_window.v1';

        // --- URL PARSING ---
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');

        // Read token from localStorage; migrate legacy URL tokens and clean the URL
        let userToken = localStorage.getItem('eve_token');
        const urlToken = urlParams.get('token');
        if (urlToken && urlToken !== 'None') {
            userToken = urlToken;
            localStorage.setItem('eve_token', urlToken);
            history.replaceState(null, '', redirectUri);
        }

        // --- STATE ---
        let contractData = [];
        let visibleData = [];
        let currentSort = { column: 'title', direction: 'asc' };
        let activeFilters = new Set();
        let searchQuery = '';

        const CLASS_LABELS = {
            1: 'Frigate', 2: 'Destroyer', 3: 'Cruiser', 4: 'Battlecruiser',
            5: 'Battleship', 6: 'Capital', 7: 'Industrial', 99: 'Unknown'
        };

        // --- AUTH UI ---
        function renderLoggedIn() {
            document.getElementById('auth-section').innerHTML = '';
        }

        function renderLoginButton() {
            document.getElementById('auth-section').innerHTML =
                `<img src="https://web.ccpgamescdn.com/eveonlineassets/developers/eve-sso-login-black-small.png"
                     class="sso-button-img"
                     alt="Log in with EVE Online"
                     onclick="startPkceLogin()">`;
        }

        async function validateToken() {
            if (!userToken || userToken === 'None') return;
            try {
                const res = await fetch('https://esi.evetech.net/verify/', {
                    headers: { 'Authorization': `Bearer ${userToken}` }
                });
                if (res.status === 401 || res.status === 403) {
                    // Token expired or revoked
                    userToken = null;
                    localStorage.removeItem('eve_token');
                    renderLoginButton();
                } else if (res.ok) {
                    renderLoggedIn();
                } else {
                    // Some other error; leave UI as-is
                    console.warn('Token validation returned', res.status);
                }
            } catch (e) {
                // Network error; leave UI as-is
                console.error('Token validation failed:', e);
            }
        }

        // Set initial UI immediately based on stored token, then validate in background
        if (userToken && userToken !== 'None') {
            renderLoggedIn();
        } else {
            renderLoginButton();
        }
        validateToken();

        // --- PKCE ---
        function generateRandomString(length) {
            const validChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            let array = new Uint8Array(length);
            window.crypto.getRandomValues(array);
            return Array.from(array, x => validChars[x % validChars.length]).join('');
        }

        async function generateCodeChallenge(verifier) {
            const data = new TextEncoder().encode(verifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function startPkceLogin() {
            const verifier = generateRandomString(64);
            localStorage.setItem('pkce_verifier', verifier);
            const challenge = await generateCodeChallenge(verifier);
            const state = generateRandomString(16);
            const loginUrl = `https://login.eveonline.com/v2/oauth/authorize?response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&client_id=${clientId}&scope=${scope}&code_challenge=${challenge}&code_challenge_method=S256&state=${state}`;
            window.location.href = loginUrl;
        }

        if (authCode) {
            const verifier = localStorage.getItem('pkce_verifier');
            fetch('https://login.eveonline.com/v2/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'authorization_code',
                    client_id: clientId,
                    code: authCode,
                    code_verifier: verifier
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.access_token) {
                    localStorage.setItem('eve_token', data.access_token);
                    window.location.replace(redirectUri);
                } else {
                    alert('Authentication failed.');
                }
            })
            .catch(err => console.error('Token exchange failed:', err));
        }

        // --- DATA FETCH ---
        fetch('contracts.json')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                return response.text();
            })
            .then(text => {
                if (!text || text.trim() === '') throw new Error('contracts.json is completely empty!');
                const payload = JSON.parse(text);

                // Backward compat: accept both new object schema and old array schema
                if (Array.isArray(payload)) {
                    contractData = payload;
                } else {
                    contractData = payload.contracts || [];
                    if (payload.updated_at) {
                        document.getElementById('last-updated').textContent =
                            'Synced ' + timeAgo(payload.updated_at);
                    }
                }

                buildFilterChips();
                sortBy('title');
            })
            .catch(err => {
                console.error('Data Load Error:', err);
                document.getElementById('contract-grid').innerHTML =
                    `<div class="status-message"><b>Waiting for backend to sync data... (${err.message})</b></div>`;
            });

        // --- FORMATTERS ---
        function fmtIsk(n) {
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B ISK';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M ISK';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K ISK';
            return n.toLocaleString() + ' ISK';
        }

        function timeAgo(isoString) {
            const then = new Date(isoString);
            const now = new Date();
            const diffSec = Math.floor((now - then) / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHr = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHr / 24);

            if (diffSec < 60) return 'just now';
            if (diffMin < 60) return `${diffMin} minute${diffMin !== 1 ? 's' : ''} ago`;
            if (diffHr < 24) return `${diffHr} hour${diffHr !== 1 ? 's' : ''} ago`;
            return `${diffDay} day${diffDay !== 1 ? 's' : ''} ago`;
        }

        // --- FILTER CHIPS ---
        function buildFilterChips() {
            const container = document.getElementById('filter-chips');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'chip active';
            allBtn.textContent = 'All';
            allBtn.dataset.weight = 'all';
            allBtn.onclick = () => setFilter('all');
            container.appendChild(allBtn);

            const weights = [...new Set(contractData.map(c => c.class_weight))].sort((a, b) => a - b);
            for (const w of weights) {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.textContent = CLASS_LABELS[w] || 'Class ' + w;
                btn.dataset.weight = String(w);
                btn.onclick = () => setFilter(w);
                container.appendChild(btn);
            }
        }

function setFilter(weight) {
    if (weight === 'all') {
        activeFilters.clear();
    } else {
        const w = Number(weight);
        const wasActive = activeFilters.has(w);
        activeFilters.clear();          // turn off everything else
        if (!wasActive) activeFilters.add(w);
    }
    document.querySelectorAll('.chip').forEach(chip => {
        const w = chip.dataset.weight;
        if (w === 'all') {
            chip.classList.toggle('active', activeFilters.size === 0);
        } else {
            chip.classList.toggle('active', activeFilters.has(Number(w)));
        }
    });
    applyFiltersAndRender();
}

        function handleSearch(value) {
            searchQuery = value.trim().toLowerCase();
            applyFiltersAndRender();
        }

        // --- SORT + RENDER PIPELINE ---
        function sortBy(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            let visible = contractData;

if (searchQuery) {
    visible = visible.filter(c =>
        (c.title + ' ' + (c.ship_name || '')).toLowerCase().includes(searchQuery)
    );
}

            if (activeFilters.size > 0) {
                visible = visible.filter(c => activeFilters.has(c.class_weight));
            }

            visible.sort((a, b) => {
                let valA = a[currentSort.column];
                let valB = b[currentSort.column];
                if (typeof valA === 'string') {
                    valA = valA.toLowerCase();
                    valB = valB.toLowerCase();
                }
                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            visibleData = visible;
            renderCards();
        }

        function updateStats() {
            let totalIsk = 0;
            let totalShips = 0;
            for (const row of contractData) {
                totalIsk += row.min_price * row.stock;
                totalShips += row.stock;
            }
            document.getElementById('total-isk').textContent = fmtIsk(totalIsk);
            document.getElementById('total-ships').textContent = totalShips.toLocaleString();
        }

        function renderCards() {
            const grid = document.getElementById('contract-grid');
            grid.innerHTML = '';
            updateStats();

            // Sort button UI
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('sort-' + currentSort.column);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('ind-title').textContent = '';
            document.getElementById('ind-min_price').textContent = '';
            const ind = document.getElementById('ind-' + currentSort.column);
            if (ind) ind.textContent = currentSort.direction === 'asc' ? ' ▲' : ' ▼';

            if (visibleData.length === 0) {
                grid.innerHTML = '<div class="status-message">No contracts match your filters.</div>';
                return;
            }

            visibleData.forEach((row, index) => {
                const card = document.createElement('div');
                card.className = 'card';

                const imgSrc = row.type_id > 0
                    ? `https://images.evetech.net/types/${row.type_id}/render?size=128`
                    : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';

                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'card-image-wrapper';

                if (row.tech_level && row.tech_level !== 't1') {
                    const badge = document.createElement('div');
                    badge.className = 'tech-badge badge-' + row.tech_level;
                    if (row.tech_level === 't2') {
                        badge.textContent = 'II';
                    } else if (row.tech_level === 't3') {
                        badge.textContent = 'III';
                    } else if (row.tech_level === 'pirate') {
                        badge.textContent = 'P';
                    }
                    // faction uses CSS triangle (no text content)
                    imgWrapper.appendChild(badge);
                }

                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'card-image';
                img.alt = row.title;
                img.onerror = function() {
                    this.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                    this.onerror = null;
                };
                img.onclick = () => openRandomContract(index);
                imgWrapper.appendChild(img);

                const shipName = row.ship_name || '';
                const sameAsShip = shipName && row.title.trim().toLowerCase() === shipName.toLowerCase();

            let shipEl = null;
            if (shipName) {
            shipEl = document.createElement('div');
            shipEl.className = 'card-ship';
            shipEl.textContent = shipName;
            }

                let name = null;
                if (!sameAsShip) {
                    name = document.createElement('div');
                    name.className = 'card-name' + (shipName ? ' card-subtitle' : '');
                    name.textContent = row.title;
                }
                
                const details = document.createElement('div');
                details.className = 'card-details';
                details.innerHTML = `
                    <span class="card-price">${fmtIsk(row.min_price)}</span>
                    <span class="card-count">${row.stock} ship${row.stock !== 1 ? 's' : ''}</span>
                `;
                
                card.appendChild(imgWrapper);
                if (shipEl) card.appendChild(shipEl);
                if (name) card.appendChild(name);
                card.appendChild(details);
                grid.appendChild(card);
            });
        }

        // --- OPEN IN-GAME WINDOW ---
        function openRandomContract(index) {
            if (!userToken || userToken === 'None') {
                alert('You must log in first!');
                return;
            }

            const row = visibleData[index];
            const ids = row.cheapest_ids;
            const randomContractId = ids[Math.floor(Math.random() * ids.length)];

            fetch(`https://esi.evetech.net/latest/ui/openwindow/contract/?contract_id=${randomContractId}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${userToken}`,
                    'Accept': 'application/json'
                }
            })
            .then(res => {
                if (res.status === 401) {
                    // Access token expired / revoked
                    userToken = null;
                    localStorage.removeItem('eve_token');
                    renderLoginButton();
                    alert('Your session has timed out. Please log in again.');
                    return;
                }
                if (res.status !== 204) {
                    return res.json().then(errData => {
                        alert('Failed to open window. ESI Error: ' + (errData.error || res.status));
                    });
                }
            })
            .catch(err => {
                console.error(err);
                alert('Network error trying to ping the EVE API.');
            });
        }
    </script>
</body>
</html>
